<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Notas y Trimestre</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <h2>Registro de Calificaciones</h2>
    
    <form id="formNotas">
      <!-- Datos Personales -->
      <fieldset>
        <legend>Datos del Aprendiz / Estudiante</legend>
        <div class="grid-3">
          <div>
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" required placeholder="Ej: Ana Gómez">
          </div>
          <div>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" min="1" required placeholder="Ej: 18">
          </div>
          <div>
            <label for="trimestre">Trimestre:</label>
            <input type="number" id="trimestre" min="1" max="12" required placeholder="Ej: 1">
          </div>
        </div>
      </fieldset>

      <!-- Competencia 1 -->
      <fieldset>
        <legend>Competencia 1</legend>
        <div class="form-group">
          <label for="comp1">Nombre de la Competencia:</label>
          <input type="text" id="comp1" required placeholder="Ej: Programación Web">
        </div>
        <div class="grid-3">
          <div>
            <label for="c1n1">Nota 1:</label>
            <input type="number" id="c1n1" min="1" max="5" step="0.1" required>
          </div>
          <div>
            <label for="c1n2">Nota 2:</label>
            <input type="number" id="c1n2" min="1" max="5" step="0.1" required>
          </div>
          <div>
            <label for="c1n3">Nota 3:</label>
            <input type="number" id="c1n3" min="1" max="5" step="0.1" required>
          </div>
        </div>
      </fieldset>

      <!-- Competencia 2 -->
      <fieldset>
        <legend>Competencia 2</legend>
        <div class="form-group">
          <label for="comp2">Nombre de la Competencia:</label>
          <input type="text" id="comp2" required placeholder="Ej: Bases de Datos">
        </div>
        <div class="grid-3">
          <div>
            <label for="c2n1">Nota 1:</label>
            <input type="number" id="c2n1" min="1" max="5" step="0.1" required>
          </div>
          <div>
            <label for="c2n2">Nota 2:</label>
            <input type="number" id="c2n2" min="1" max="5" step="0.1" required>
          </div>
          <div>
            <label for="c2n3">Nota 3:</label>
            <input type="number" id="c2n3" min="1" max="5" step="0.1" required>
          </div>
        </div>
      </fieldset>

      <div class="acciones">
        <button type="submit" id="btnCalcular">Calcular Promedios</button>
        <button type="button" id="btnLimpiar" class="btn-secundario">Limpiar</button>
      </div>
    </form>

    <!-- Resultados dinámicos -->
    <div id="resultado" class="resultado hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
